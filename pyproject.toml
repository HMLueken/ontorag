[project]
name = "ontorag"
version = "0.1.13"
description = "Ontology-first RAG: extract a governed knowledge graph from documents and serve it over SPARQL and MCP."
readme = "README.md"
requires-python = ">=3.12"
license = { file = "LICENSE" }
authors = [{ name = "Marco Montanari", email = "sirmmo@gmail.com" }]
keywords = ["rag", "ontology", "knowledge-graph", "rdf", "sparql", "mcp", "llm", "nlp", "semantic-web"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: Apache Software License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Topic :: Text Processing :: Linguistic",
]
# Floors are what we use; ceilings are at the next major, because a major bump is
# where these libraries have actually broken us. `ontorag` is a published package
# and the Hub depends on it, so nothing is pinned to an exact version -- that
# would make it unresolvable alongside anything else.
dependencies = [
  "typer>=0.12.0,<1",
  "requests>=2.31.0,<3",
  "pydantic>=2.0.0,<3",
  "rdflib>=7.0.0,<8",
  "python-dotenv>=1.0.1,<2",
  "fastapi>=0.110.0,<1",
  "uvicorn>=0.29.0,<1",
  # fastmcp churns hard: 2.x hides tool listing behind `_list_tools`, and the
  # transport API moved in both 3.x and 4.x. `mcp-server` shipped broken against
  # every one of them because `fastmcp>=0.1.0` meant "whatever installs today".
  # 4.x is what the suite runs against.
  "fastmcp>=4.0,<5",
  # `mcp.client.sse` (mcp_client.py) is stable from 1.6 through 2.x -- verified on
  # 2.2.0. The sibling ontorag-mcp server pins <2 instead: it uses the 1.x FastMCP
  # class that 2.x renamed, which this package does not.
  "mcp>=1.6,<3",
  "EbookLib>=0.18,<1",
  "html2text>=2024.2.26",
  "httpx>=0.27.0,<1",
]

[project.optional-dependencies]
pdf = ["pymupdf>=1.24.0,<2"]
pageindex = ["pageindex>=0.2.5"]
llamaindex = ["llama-index>=0.10.0,<1"]
docling = ["docling>=2.0.0,<3"]
unstructured = ["unstructured>=0.15.0,<1"]
neo4j = ["neo4j>=5.0,<7"]
dev = ["pytest>=8.0,<9", "pytest-asyncio>=0.23,<2", "jsonschema>=4.18,<5", "build>=1.2,<2", "twine>=5.1,<7"]

[project.urls]
Homepage = "https://github.com/ontorag/ontorag"
Repository = "https://github.com/ontorag/ontorag"
Issues = "https://github.com/ontorag/ontorag/issues"

[project.scripts]
ontorag = "ontorag.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["ontorag"]
