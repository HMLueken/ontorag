name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install --upgrade pip
      - run: pip install -e ".[dev]"

      # Without the extension the vector-index tests skip, which would mean
      # shipping tests that never run. Fetching it is also the only coverage the
      # downloader gets. Upstream being unreachable must not fail the build: the
      # tests go back to skipping, which the suite reports.
      - name: Fetch sqlite-vector
        continue-on-error: true
        run: python -c "from ontorag.vector_index import extension_path; print(extension_path(download=True))"

      - run: pytest -q
